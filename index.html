<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News DNA Analyzer</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <h1>Fake News DNA Analyzer</h1>

        <p class="tagline">
            Beyond Fake or Real — Analyze the evidence, contradictions and reasoning behind news.
        </p>

        <div class="analyzer-box">

            <h2>Analyze News</h2>

            <textarea
                id="newsText"
                placeholder="Paste your news article or claim here..."
            ></textarea>

            <button onclick="analyzeNews()">
                Analyze News
            </button>

        </div>

        <div id="result"></div>
        <div class="chart-box" id="chartBox" hidden>
    <h2>News DNA Visualization</h2>
    <canvas id="dnaChart"></canvas>
</div>

    </div>

    <script src="script.js"></script>
    <button onclick="logout()" style="position: fixed; top: 15px; right: 15px; padding: 10px 18px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer;">
    Logout
</button>

<script>
function logout() {
    localStorage.clear();
    sessionStorage.clear();
    window.location.href = "login.html";
}
</script>
<script>
if (!sessionStorage.getItem("loggedInUser")) {
    window.location.replace("login.html");
}
</script>
</body>

</html>
