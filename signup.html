<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Fake News DNA Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Create Account</h1>
            <form id="signupForm">
                <label>Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Password</label>
                <input type="password" id="password" minlength="8" required>

                <button type="submit">Sign Up</button>
            </form>

            <p id="message"></p>
            <p>Already registered? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
    document.getElementById("signupForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const message = document.getElementById("message");

        try {
            const response = await fetch("https://fake-news-dna-analyzer.onrender.com/api/auth/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            });

            if (response.ok) {
                message.innerText = "Account created! Please login.";
                setTimeout(() => window.location.href = "login.html", 1000);
            } else {
                message.innerText = "Signup failed. Please try again.";
            }
        } catch (error) {
            message.innerText = "Backend connection failed.";
        }
    });
    </script>
</body>
</html>
